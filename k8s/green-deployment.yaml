apiVersion: apps/v1
kind: Deployment
metadata:
  name: green-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vle8
      color: green
  template:
    metadata:
      labels:
        app: vle8
        color: green
    spec:
      containers:
        - name: green-container
          image: vle8-green:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
